<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Weekly Plan - Lab 4</title>
  <link rel="stylesheet" href="style.css">
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Caveat:wght@500&family=Montserrat:wght@400;600;700;800&display=swap" rel="stylesheet">
  

  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="planner-container">
    
    <header class="header">
      <div class="title-box">
        <h1>WEEKLY PLAN</h1>
        <span class="to-do">TO DO</span>
      </div>

      <div class="header-fields">
        <div class="field-group">
          <label>WEEK OF</label>
          <input type="text">
        </div>
        <div class="field-group">
          <label>HEALTHY HABIT</label>
          <input type="text" style="width: 160px;">
        </div>
        <div class="status-checks">
          <div class="status-item">
            <label>ROCKED IT</label>
            <input type="checkbox">
          </div>
          <div class="status-item">
            <label>ROOM FOR IMPROVEMENT</label>
            <input type="checkbox">
          </div>
        </div>
      </div>
    </header>

    <div class="grid-body">
      
      <aside class="sidebar">
        <section>
          <div class="section-title">TOP 3 GOALS</div>
          <div class="todo-list">
            <div class="todo-item"><input type="checkbox"><input type="text"></div>
            <div class="todo-item"><input type="checkbox"><input type="text"></div>
            <div class="todo-item"><input type="checkbox"><input type="text"></div>
          </div>
        </section>

        <section style="flex-grow: 1;">
          <div class="section-title">EVERYTHING ELSE</div>
          <div class="todo-list">
            <div class="todo-item"><input type="checkbox"><input type="text"></div>
            <div class="todo-item"><input type="checkbox"><input type="text"></div>
            <div class="todo-item"><input type="checkbox"><input type="text"></div>
            <div class="todo-item"><input type="checkbox"><input type="text"></div>
            <div class="todo-item"><input type="checkbox"><input type="text"></div>
            <div class="todo-item"><input type="checkbox"><input type="text"></div>
            <div class="todo-item"><input type="checkbox"><input type="text"></div>
            <div class="todo-item"><input type="checkbox"><input type="text"></div>
            <div class="todo-item"><input type="checkbox"><input type="text"></div>
            <div class="todo-item"><input type="checkbox"><input type="text"></div>
          </div>
        </section>

        <section>
          <div class="section-title">NEXT WEEK</div>
          <div class="todo-list">
            <div class="todo-item"><input type="checkbox"><input type="text"></div>
            <div class="todo-item"><input type="checkbox"><input type="text"></div>
            <div class="todo-item"><input type="checkbox"><input type="text"></div>
            <div class="todo-item"><input type="checkbox"><input type="text"></div>
          </div>
        </section>
      </aside>

      <div class="day-card">
        <div class="day-header">
          <span>MONDAY</span>
          <input type="checkbox">
        </div>
        <textarea></textarea>
      </div>

      <div class="day-card">
        <div class="day-header">
          <span>TUESDAY</span>
          <input type="checkbox">
        </div>
        <textarea></textarea>
      </div>

      <div class="day-card">
        <div class="day-header">
          <span>WEDNESDAY</span>
          <input type="checkbox">
        </div>
        <textarea></textarea>
      </div>

      <div class="day-card">
        <div class="day-header">
          <span>THURSDAY</span>
          <input type="checkbox">
        </div>
        <textarea></textarea>
      </div>

      <div class="day-card">
        <div class="day-header">
          <span>FRIDAY</span>
          <input type="checkbox">
        </div>
        <textarea></textarea>
      </div>

      <div class="weekend-container">
        <div class="day-card">
          <div class="day-header">
            <span>SATURDAY</span>
            <input type="checkbox">
          </div>
          <textarea></textarea>
        </div>

        <div class="day-card">
          <div class="day-header">
            <span>SUNDAY</span>
            <input type="checkbox">
          </div>
          <textarea></textarea>
        </div>
      </div>

    </div>

    <div class="footer-bar"></div>
  </div>

</body>
</html>
