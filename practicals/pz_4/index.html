<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Практична робота №4</title>
    <link rel="stylesheet" href="style.css">
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="keyboard">

    <div class="main-block">
      <div class="row row-f">
        <button class="key">Esc</button>
        <button class="key">F1</button>
        <button class="key">F2</button>
        <button class="key">F3</button>
        <button class="key">F4</button>
        <div class="empty"></div>
        <button class="key">F5</button>
        <button class="key">F6</button>
        <button class="key">F7</button>
        <button class="key">F8</button>
        <div class="empty"></div>
        <button class="key">F9</button>
        <button class="key">F10</button>
        <button class="key">F11</button>
        <button class="key">F12</button>
      </div>

      <div class="row row-1">
        <button class="key">~</button>
        <button class="key">1</button><button class="key">2</button><button class="key">3</button>
        <button class="key">4</button><button class="key">5</button><button class="key">6</button>
        <button class="key">7</button><button class="key">8</button><button class="key">9</button>
        <button class="key">0</button><button class="key">-</button><button class="key">=</button>
        <button class="key">Backspace</button>
      </div>

      <div class="row row-2">
        <button class="key">Tab</button>
        <button class="key">Q</button><button class="key">W</button><button class="key">E</button>
        <button class="key">R</button><button class="key">T</button><button class="key">Y</button>
        <button class="key">U</button><button class="key">I</button><button class="key">O</button>
        <button class="key">P</button><button class="key">[</button><button class="key">]</button>
        <button class="key">\</button>
      </div>

      <div class="row row-3">
        <button class="key">Caps</button>
        <button class="key">A</button><button class="key">S</button><button class="key">D</button>
        <button class="key">F</button><button class="key">G</button><button class="key">H</button>
        <button class="key">J</button><button class="key">K</button><button class="key">L</button>
        <button class="key">;</button><button class="key">'</button>
        <button class="key">Enter</button>
      </div>

      <div class="row row-4">
        <button class="key">Shift</button>
        <button class="key">Z</button><button class="key">X</button><button class="key">C</button>
        <button class="key">V</button><button class="key">B</button><button class="key">N</button>
        <button class="key">M</button><button class="key">,</button><button class="key">.</button>
        <button class="key">/</button>
        <button class="key">Shift</button>
      </div>

      <div class="row row-5">
        <button class="key">Ctrl</button>
        <button class="key">Win</button>
        <button class="key">Alt</button>
        <button class="key">Space</button>
        <button class="key">Alt</button>
        <button class="key">Win</button>
        <button class="key">Menu</button>
        <button class="key">Ctrl</button>
      </div>
    </div>

    <div class="nav-block">
      <div class="nav-top">
        <button class="key">PrtSc</button>
        <button class="key">ScrLk</button>
        <button class="key">Pause</button>
      </div>
      <div class="nav-top">
        <button class="key">Ins</button>
        <button class="key">Home</button>
        <button class="key">PgUp</button>
      </div>
      <div class="nav-top">
        <button class="key">Del</button>
        <button class="key">End</button>
        <button class="key">PgDn</button>
      </div>
      <div class="empty"></div>
      <div class="arrows">
        <button class="key up-arrow">▲</button>
        <button class="key" style="grid-row:2; grid-column:1;">◄</button>
        <button class="key" style="grid-row:2; grid-column:2;">▼</button>
        <button class="key" style="grid-row:2; grid-column:3;">►</button>
      </div>
    </div>

    <div class="numpad-block">
      <div class="empty"></div>
      <div class="numpad-grid">
        <button class="key">Num</button>
        <button class="key">/</button>
        <button class="key">*</button>
        <button class="key">-</button>
        
        <button class="key">7</button>
        <button class="key">8</button>
        <button class="key">9</button>
        <button class="key span-v">+</button>
        
        <button class="key">4</button>
        <button class="key">5</button>
        <button class="key">6</button>
        
        <button class="key">1</button>
        <button class="key">2</button>
        <button class="key">3</button>
        <button class="key span-v">Enter</button>
        
        <button class="key span-h">0</button>
        <button class="key">.</button>
      </div>
    </div>

  </div>

</body>
</html>
